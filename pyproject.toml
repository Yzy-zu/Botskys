[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "botsky"
version = "0.1.0.dev0"
description = "Botsky: comandos explícitos y herramientas con autoridad durable"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
media = [
  "pillow==13.0.0", "pypdf==6.21.3", "pypdfium2==5.14.0",
  "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2",
  "pdfplumber==0.11.10", "olefile==0.47", "markdown-it-py==4.2.0",
  "httpx==0.28.1",
]
dev = ["reportlab==4.5.1"]
ai = ["google-genai==2.33.0", "edge-tts==7.3.1", "httpx==0.28.1"]
integrations = ["httpx==0.28.1"]

[project.scripts]
botsky = "botsky.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
botsky = ["migrations/*.sql", "assets/reactions/*.webp", "assets/reactions/catalog.json"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
