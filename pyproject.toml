[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "botsky"
version = "0.1.0.dev0"
description = "Botsky: comandos explícitos y herramientas con autoridad durable"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
botsky = "botsky.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
botsky = ["migrations/*.sql"]
